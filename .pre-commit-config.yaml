# Run locally with: uvx pre-commit run --all-files
# All hooks use the same uv.lock-resolved lint tools as CI.
repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: Ruff lint
        entry: uv run --locked --no-default-groups --group lint ruff check --fix
        language: system
        types_or: [python, pyi]
        pass_filenames: true
      - id: ruff-format
        name: Ruff format
        entry: uv run --locked --no-default-groups --group lint ruff format
        language: system
        types_or: [python, pyi]
        pass_filenames: true
      - id: ty
        name: ty (Astral type checker)
        entry: uv run --locked --no-default-groups --group lint ty check
        language: system
        pass_filenames: false
        always_run: true
