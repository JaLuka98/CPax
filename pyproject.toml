[build-system]
requires = ["setuptools>=65.5", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "CPax"
version = "2025.05.0"
description = "CPax: A JAX-based computational physics library."
requires-python = ">=3.12"
authors = [
  { name = "Jan Lukas Späh"}
]
license = { text = "MIT" }
readme = "README.md"
keywords = ["physics", "computational", "jax", "autograd", "ODE", "PDE"]
classifiers = [
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "License :: OSI Approved :: MIT License"
]

dependencies = [
  "equinox>=0.13.8",
  "jax>=0.11",
  "numpy>=2.0",
  "matplotlib>=3.7",
]

[dependency-groups]
test = [
  "packaging>=24",
  "pytest",
]
lint = [
  "ruff==0.16.10",
  "ty==0.0.84",
]
docs = [
  "sphinx>=5.0",
  "sphinx-rtd-theme",
  "sphinx-autodoc-typehints",
  "sphinx-autoapi",
  "myst-parser",
]
dev = [
  { include-group = "test" },
  { include-group = "lint" },
  { include-group = "docs" },
  "bump-my-version",
]

[project.urls]
"Source" = "https://github.com/JaLuka98/CPax"
"Tracker" = "https://github.com/JaLuka98/CPax/issues"


[tool.bumpversion]
parse = '^(?P<release>[1-9][0-9]{3}\.(?:1[0-2]|0?[1-9]))\.(?P<patch>[0-9]+)$'
serialize = ["{release}.{patch}"]
commit = false
tag = false
tag_name = "v{new_version}"

[tool.bumpversion.parts.release]
calver_format = "{YYYY}.{MM}"

[[tool.bumpversion.files]]
filename = "pyproject.toml"
search = 'version = "{current_version}"'
replace = 'version = "{new_version}"'
[tool.ruff]
target-version = "py312"
line-length = 119

[tool.ruff.lint]
select = [
  "E4",   # Import conventions
  "E7",   # Statement conventions
  "E9",   # Syntax errors
  "F",    # Pyflakes
  "I",    # isort
  "UP",   # Modern Python syntax
  "B",    # flake8-bugbear
  "SIM",  # flake8-simplify
  "C4",   # flake8-comprehensions
  "PIE",  # flake8-pie
  "RUF",  # Ruff-specific correctness checks
  "NPY",  # NumPy correctness
  "PERF", # Perflint
]

[tool.ruff.lint.per-file-ignores]
"src/cpax/__init__.py" = ["F401"]
"src/cpax/ode/__init__.py" = ["F401"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true

# Type-check the public library. Tests and examples can be added after the
# scientific API has been fully annotated.
[tool.ty.src]
include = ["src"]
