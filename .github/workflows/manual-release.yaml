name: Manual CalVer Release

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Preview release without pushing"
        type: boolean
        default: true
        required: true

permissions:
  contents: write

concurrency:
  group: cpax-manual-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Enforce main
        env:
          REF: ${{ github.ref }}
        run: |
          test "$REF" = "refs/heads/main" || { echo "::error::Select main"; exit 1; }

      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
          fetch-tags: true

      - name: Reject stale checkout
        run: |
          git fetch origin main --no-tags
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)" || {
            echo "::error::main changed; rerun this workflow"
            exit 1
          }

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install release dependencies
        run: uv sync --locked --no-default-groups --group dev

      - name: Prepare and validate release in disposable checkout
        env:
          DRY_RUN: ${{ inputs.dry_run }}
        run: bash scripts/manual_release.sh

      - name: Publish release commit and annotated tag
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pyproject.toml uv.lock
          git diff --cached --check
          git diff --cached --quiet && { echo "::error::No release changes"; exit 1; }
          git commit -m "Release: $VERSION"
          git tag -a "v$VERSION" -m "CPax v$VERSION"
          AUTH_HEADER="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $AUTH_HEADER" \
            push --atomic origin HEAD:refs/heads/main "refs/tags/v$VERSION"
