# Temporary one-shot maintenance workflow. Removes itself once the
# lockfile and formatting have been committed to this issue branch.
name: Refresh Astral tooling files
on:
  push:
    branches: ["29-switch-to-a-ruff-based-pipeline"]

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout issue branch
        uses: actions/checkout@v7
        with:
          persist-credentials: true

      - name: Install uv and Python 3.12
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.12"

      - name: Update the lockfile
        run: uv lock

      - name: Apply safe Ruff fixes and formatting
        run: |
          uv run --locked --no-default-groups --group lint ruff check --fix . || true
          uv run --locked --no-default-groups --group lint ruff format .

      - name: Remove this temporary workflow and commit generated changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/bootstrap-astral.yaml
          git add uv.lock .
          git commit -m "Apply Ruff formatting and regenerate uv lock for Astral tooling"
          git push origin HEAD
