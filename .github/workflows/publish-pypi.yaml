name: Publish to PyPI

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing annotated CalVer tag (required on main; ignored in branch dry runs)"
        type: string
        required: false
      dry_run:
        description: "Validate and build without uploading to PyPI"
        type: boolean
        default: true
        required: true

permissions:
  contents: read

concurrency:
  group: cpax-pypi-release
  cancel-in-progress: false

jobs:
  validate-build:
    # Branch dry runs build candidate code. Real releases still require main.
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    outputs:
      version: ${{ steps.tag.outputs.version || steps.candidate.outputs.version }}
      release_sha: ${{ steps.tag.outputs.sha || steps.candidate.outputs.sha }}
    steps:
      - name: Reject real publication outside main
        if: ${{ !inputs.dry_run && github.ref != 'refs/heads/main' }}
        run: |
          echo "::error::Real PyPI publication must be dispatched from main."
          exit 1

      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
          fetch-tags: true

      - name: Preserve artifact validator from the selected workflow revision
        run: cp scripts/validate_pypi_dist.py "$RUNNER_TEMP/validate_pypi_dist.py"

      - name: Fetch current main and selected release tag
        if: ${{ github.ref == 'refs/heads/main' }}
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^v[1-9][0-9]{3}\.([1-9]|0?[1-9]|1[0-2])\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::Invalid CalVer tag"
            exit 1
          fi
          git fetch origin +refs/heads/main:refs/remotes/origin/main --no-tags
          git fetch origin "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG" --no-tags

      - name: Verify annotated tag and package metadata
        if: ${{ github.ref == 'refs/heads/main' }}
        id: tag
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          SHA="$(python scripts/validate_pypi_tag.py "$RELEASE_TAG")"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "version=${RELEASE_TAG#v}" >> "$GITHUB_OUTPUT"
          git checkout --detach "$SHA"
          test "$(git rev-parse HEAD)" = "$SHA"
          git diff --quiet
          git diff --cached --quiet

      - name: Validate branch candidate (non-publishing dry run only)
        if: ${{ github.ref != 'refs/heads/main' && inputs.dry_run }}
        id: candidate
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          import subprocess
          import tomllib
          from pathlib import Path

          project = tomllib.loads(Path("pyproject.toml").read_text())["project"]
          lock = tomllib.loads(Path("uv.lock").read_text())
          version = project["version"]
          assert project["name"].lower() == "cpax"
          versions = [pkg["version"] for pkg in lock["package"] if pkg["name"].lower() == "cpax"]
          assert versions == [version], "CPax version differs between pyproject.toml and uv.lock"
          sha = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          with open(os.environ["GITHUB_OUTPUT"], "a") as outputs:
              print(f"version={version}", file=outputs)
              print(f"sha={sha}", file=outputs)
          PY
          echo "::notice::Testing the checked-out branch. No release tag is validated and no upload is possible."

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Build tagged source and verify artifacts
        env:
          RELEASE_VERSION: ${{ steps.tag.outputs.version || steps.candidate.outputs.version }}
        run: |
          set -euo pipefail
          uv lock --check
          uv build
          python "$RUNNER_TEMP/validate_pypi_dist.py" "$RELEASE_VERSION" dist

      - name: Smoke-test installed wheel outside the checkout
        env:
          RELEASE_VERSION: ${{ steps.tag.outputs.version || steps.candidate.outputs.version }}
        run: |
          set -euo pipefail
          uv venv "$RUNNER_TEMP/cpax-pypi-smoke" --python 3.12
          uv pip install --python "$RUNNER_TEMP/cpax-pypi-smoke/bin/python" dist/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/cpax-pypi-smoke/bin/python" - <<'PY'
          import os
          import jax.numpy as jnp
          from importlib.metadata import version
          import cpax
          from cpax.mechanics import NewtonianSystem, PhaseSpaceState

          expected = os.environ["RELEASE_VERSION"]
          assert version("cpax") == expected == cpax.__version__
          system = NewtonianSystem(potential=lambda q: q**2 / 2, mass=1.0)
          ivp = cpax.IVP(system, PhaseSpaceState(1.0, 0.0), (0.0, 1.0))
          solution = cpax.solve(ivp, saveat=cpax.SaveAt.linspace(11))
          assert bool(solution.is_success)
          assert bool(jnp.allclose(solution.ys.q[-1], jnp.cos(1.0), atol=1e-3))
          PY

      - name: Upload verified distributions
        if: ${{ !inputs.dry_run }}
        uses: actions/upload-artifact@v7
        with:
          name: cpax-pypi-dist
          path: |
            dist/*.whl
            dist/*.tar.gz
          if-no-files-found: error
          retention-days: 1

      - name: Release validation summary
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_SHA: ${{ steps.tag.outputs.sha || steps.candidate.outputs.sha }}
          SOURCE_MODE: ${{ steps.candidate.outcome == 'success' && 'development branch (not release-tag validation)' || 'verified release tag' }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          {
            echo "## CPax PyPI publication check"
            echo "Requested tag: $RELEASE_TAG"
            echo "Source: $SOURCE_MODE"
            echo "Tested commit: $RELEASE_SHA"
            echo "Dry run: $DRY_RUN"
            echo "Tag validation, artifact metadata and installed-wheel simulation passed."
          } >> "$GITHUB_STEP_SUMMARY"

  publish:
    if: ${{ !inputs.dry_run && github.ref == 'refs/heads/main' }}
    needs: validate-build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: pypi
      url: https://pypi.org/project/CPax/${{ needs.validate-build.outputs.version }}/
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Download only the verified distributions
        uses: actions/download-artifact@v8
        with:
          name: cpax-pypi-dist
          path: dist

      - name: Publish via PyPI Trusted Publishing (OIDC)
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist/
