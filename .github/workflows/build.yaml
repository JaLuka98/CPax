name: Build

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Validate lockfile
        run: uv lock --check
      - name: Build wheel and source distribution
        run: uv build
      - name: Install built wheel in clean environment
        run: |
          uv venv /tmp/cpax-install --python 3.12
          uv pip install --python /tmp/cpax-install/bin/python dist/*.whl packaging
          /tmp/cpax-install/bin/python - <<'PY'
          from importlib.metadata import version
          import tomllib
          import cpax
          from packaging.version import Version

          with open("pyproject.toml", "rb") as file:
              expected = tomllib.load(file)["project"]["version"]
          assert Version(cpax.__version__) == Version(expected)
          assert Version(version("CPax")) == Version(expected)
          PY
